name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MailDrop ${{ github.ref_name }}'
          releaseBody: |
            ## 下載

            | 類型 | 檔案 |
            |------|------|
            | 安裝版（推薦） | `MailDrop_*_x64_en-US.msi` |
            | 免安裝版 | `MailDrop_*_x64-setup.exe` |

            > MailDrop — 本地開發用 SMTP 郵件攔截工具
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload portable exe
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/maildrop.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
